<!doctype html>
<!--
  Static page for visitors without access (HTTP 404). No JavaScript needed.
  Contract with the server (backend web module): it serves this one file for both cases
  and sets the mode attribute on the <html> element below to one of
    gate      no access cookie: "scan a QR code" (the default in this file)
    notfound  access, but the page does not exist
  app.css then shows the matching block (.vb-mode-gate / .vb-mode-notfound).
-->
<html lang="de" data-surface="dark" data-vb-mode="gate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2b0f0c" />
    <meta name="color-scheme" content="dark" />
    <title>Party</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script src="/gate-hint.js" defer></script>
  </head>
  <body>
    <main
      class="mx-auto grid min-h-dvh max-w-[35rem] content-center gap-6 px-6 py-8 lg:max-w-[65rem] lg:grid-cols-[22.5rem_1fr] lg:items-center lg:gap-16"
    >
      <div class="relative grid aspect-[3/4] w-50 place-items-center bg-film lg:w-full" aria-hidden="true">
        <svg class="absolute inset-x-0 top-1.5 h-2 w-full text-film-hole">
          <defs>
            <pattern id="gate-holes" width="14" height="8" patternUnits="userSpaceOnUse">
              <rect x="3" y="1" width="8" height="6" rx="2" fill="currentColor" />
            </pattern>
          </defs>
          <rect width="100%" height="8" fill="url(#gate-holes)" />
        </svg>
        <span class="vb-mode-gate">
          <svg
            class="size-24 text-accent lg:size-48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 12v4a1 1 0 0 1-1 1h-4" />
            <path d="M17 3h2a2 2 0 0 1 2 2v2" />
            <path d="M17 8V7" />
            <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
            <path d="M3 7V5a2 2 0 0 1 2-2h2" />
            <path d="M7 17h.01" />
            <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
            <rect x="7" y="7" width="5" height="5" rx="1" />
          </svg>
        </span>
        <span class="vb-mode-notfound">
          <svg
            class="size-24 text-accent lg:size-48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M7 3v18" />
            <path d="M3 7.5h4" />
            <path d="M3 12h18" />
            <path d="M3 16.5h4" />
            <path d="M17 3v18" />
            <path d="M17 7.5h4" />
            <path d="M17 16.5h4" />
          </svg>
        </span>
        <svg class="absolute inset-x-0 bottom-1.5 h-2 w-full text-film-hole">
          <rect width="100%" height="8" fill="url(#gate-holes)" />
        </svg>
      </div>

      <div class="vb-mode-gate">
        <section class="grid gap-3" data-testid="gate">
          <h1 class="text-2xl font-bold lg:text-3xl">Scan den QR-Code</h1>
          <p class="text-md lg:text-lg">
            Diese Seite öffnet sich nur über einen der <span class="whitespace-nowrap">QR-Codes</span> auf der
            Party.
          </p>
          <p class="text-ink-muted lg:text-md">
            Halte die Kamera deines Handys auf den Code und tippe auf den Link.
          </p>
          <!-- gate-hint.js fills and shows this in the browsers of Instagram, WhatsApp & co. -->
          <p
            class="vb-gate-app mt-2 rounded-control border border-accent bg-accent-tint p-4 lg:text-md"
            data-testid="gate-app-hint"
            hidden
          ></p>
        </section>
      </div>

      <div class="vb-mode-notfound">
        <section class="grid justify-items-start gap-3" data-testid="notfound">
          <h1 class="text-2xl font-bold lg:text-3xl">Hier ist nichts.</h1>
          <p class="text-md lg:text-lg">Diese Seite gibt es nicht. Zurück zur Party?</p>
          <a class="vb-btn vb-btn--primary mt-3" href="/">Zum Start</a>
        </section>
      </div>
    </main>
  </body>
</html>
