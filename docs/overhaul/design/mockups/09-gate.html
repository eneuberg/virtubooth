<!doctype html>
<html lang="de" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup: QR-Code scannen</title>
<link rel="stylesheet" href="kb.css">
<style>
  .screen { min-height: 100dvh; display: grid; align-content: center; padding: 32px 24px; gap: 24px; max-width: 560px; }
  .art { width: 200px; aspect-ratio: 3/4; background: var(--kamera); position: relative; display: grid; place-items: center; }
  .art svg.qr { width: 96px; height: 96px; color: var(--safelight); }
  .art .holes { position: absolute; left: 0; right: 0; }
  .art .holes:first-child { top: 6px; } .art .holes:last-child { bottom: 6px; }
  .txt { display: grid; gap: 12px; }
  @media (min-width: 900px) {
    .screen { max-width: 1040px; margin: 0 auto; grid-template-columns: 360px 1fr; align-items: center; gap: 64px; }
    .art { width: 360px; }
    .art svg.qr { width: 200px; height: 200px; }
  }
</style>
</head>
<body>
<main class="screen" data-testid="gate">
  <div class="art" aria-hidden="true">
    <span class="holes" data-p="0" data-h="8"></span>
    <i data-i="scan-qr-code" class="qr" data-w="1.5"></i>
    <span class="holes" data-p="0" data-h="8"></span>
  </div>
  <div class="txt">
    <h1 class="t34 w7 balance">Scan einen QR&#8209;Code auf der Party</h1>
    <p class="t17">Diese Seite öffnet sich nur über die QR&#8209;Codes, die auf der Party hängen.</p>
    <p class="t15 muted">Halte die Kamera deines Handys auf den Code und tippe auf den Link.</p>
  </div>
</main>
<script src="icons.js"></script>
<script src="film.js"></script>
</body>
</html>
