<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14021f">
  <title>Verwaltung · Admin</title>
  <link rel="icon" href="/static/core/icon.svg">
  <link rel="stylesheet" href="/static/core/vb.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <link rel="stylesheet" href="/admin/assets/uploadcontrols.css">
  <script src="/static/core/loader.js" defer></script>
  <script type="module" src="/admin/assets/manage.js"></script>
</head>
<body class="adm adm-manage">
  <header class="adm-header">
    <div class="adm-header-row">
      <h1 class="adm-title">🛠 Verwaltung</h1>
      <span id="conn" class="adm-conn" data-testid="conn" data-state="connecting">Verbinde…</span>
      <nav class="adm-nav" aria-label="Admin">
        <a class="vb-btn adm-btn-sm" href="/admin/live" data-testid="nav-live">📸 Live</a>
        <button id="logout" class="vb-icon-btn adm-icon-sm" type="button" title="Abmelden" aria-label="Abmelden">🚪</button>
      </nav>
    </div>
    <div class="adm-tabs" role="tablist" aria-label="Bereiche">
      <button class="adm-tab" role="tab" type="button" data-tab="fotos" id="tab-fotos" aria-controls="panel-fotos" aria-selected="false">📸 Fotos<span class="adm-count" id="count-fotos"></span></button>
      <button class="adm-tab" role="tab" type="button" data-tab="gaeste" id="tab-gaeste" aria-controls="panel-gaeste" aria-selected="false">🙂 Gäste<span class="adm-count" id="count-gaeste"></span></button>
      <button class="adm-tab" role="tab" type="button" data-tab="instagram" id="tab-instagram" aria-controls="panel-instagram" aria-selected="false">📷 Instagram<span class="adm-count" id="count-instagram"></span></button>
      <button class="adm-tab" role="tab" type="button" data-tab="sperren" id="tab-sperren" aria-controls="panel-sperren" aria-selected="false">🚫 Sperren<span class="adm-count" id="count-sperren"></span></button>
      <button class="adm-tab" role="tab" type="button" data-tab="protokoll" id="tab-protokoll" aria-controls="panel-protokoll" aria-selected="false">📜 Protokoll</button>
    </div>
    <div id="upload-controls" class="adm-uploads-slot"></div>
    <button id="new-pill" class="adm-new-pill vb-hidden" type="button" data-testid="new-pill"></button>
  </header>
  <main class="adm-main">
    <section id="panel-fotos" role="tabpanel" aria-labelledby="tab-fotos" hidden></section>
    <section id="panel-gaeste" role="tabpanel" aria-labelledby="tab-gaeste" hidden></section>
    <section id="panel-instagram" role="tabpanel" aria-labelledby="tab-instagram" hidden></section>
    <section id="panel-sperren" role="tabpanel" aria-labelledby="tab-sperren" hidden></section>
    <section id="panel-protokoll" role="tabpanel" aria-labelledby="tab-protokoll" hidden></section>
  </main>
</body>
</html>
