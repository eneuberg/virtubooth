<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14021f">
  <title>Live · Admin</title>
  <link rel="icon" href="/static/core/icon.svg">
  <link rel="stylesheet" href="/static/core/vb.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <script src="/static/core/loader.js" defer></script>
  <script type="module" src="/admin/assets/live.js"></script>
</head>
<body class="adm adm-live">
  <header class="adm-header">
    <div class="adm-header-row">
      <h1 class="adm-title">📸 Live</h1>
      <span id="conn" class="adm-conn" data-testid="conn" data-state="connecting">Verbinde…</span>
      <nav class="adm-nav" aria-label="Admin">
        <a class="vb-btn adm-btn-sm" href="/admin/manage" data-testid="nav-manage">Verwaltung</a>
        <button id="logout" class="vb-icon-btn adm-icon-sm" type="button" title="Abmelden" aria-label="Abmelden">🚪</button>
      </nav>
    </div>
    <div class="adm-stats" role="group" aria-label="Zähler">
      <div class="adm-stat"><b id="stat-photos" data-testid="stat-photos">–</b><span>Fotos</span></div>
      <div class="adm-stat"><b id="stat-guests" data-testid="stat-guests">–</b><span>Gäste</span></div>
      <div class="adm-stat adm-stat--hidden"><b id="stat-hidden" data-testid="stat-hidden">–</b><span>versteckt</span></div>
    </div>
    <button id="new-pill" class="adm-new-pill vb-hidden" type="button" data-testid="new-pill"></button>
  </header>
  <main class="adm-main">
    <div id="feed" class="adm-feed" data-testid="feed" aria-live="polite"></div>
    <div id="loading" class="adm-loading"><div class="vb-spinner"></div></div>
    <div id="empty" class="adm-empty vb-hidden" data-testid="empty">
      <strong>Noch keine Fotos.</strong>
      Sobald jemand knipst, taucht das Foto hier sofort auf.
    </div>
    <button id="more" class="vb-btn vb-btn--ghost vb-btn--block adm-more vb-hidden" type="button">Ältere Fotos laden</button>
  </main>
</body>
</html>
