# Python outside backend/ (scripts/, docs/overhaul/design/, frontend/scripts/)
# follows the backend's rules. Files under backend/ use backend/pyproject.toml.
# From the repo root: uv run --project backend ruff check . && uv run --project backend ruff format --check .
extend = "backend/pyproject.toml"

[format]
# The overhaul's working records (analysis, reviews, the final report) quote
# code as it was; the maintained docs (README, docs/*.md) stay checked.
exclude = ["docs/overhaul/**/*.md"]
