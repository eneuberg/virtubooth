# CI: the checks of `make check-all` except WebKit, split into parallel jobs.
#
# Tool versions come from the repo files (keep them in sync when bumping):
#   Python  backend/.python-version (uv installs it)
#   uv      the Dockerfile's UV_IMAGE tag
#   Node    frontend/.node-version
#   pnpm    frontend/package.json "packageManager" (installed with npm: corepack
#           cannot run pnpm 11)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.18"
  PNPM_VERSION: "11.28.5"
  # uv: fail instead of re-locking when backend/uv.lock is out of date
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and the backend's dependencies
        working-directory: backend
        run: uv sync
      - name: ruff check (every Python file; ruff.toml extends backend/pyproject.toml)
        run: uv run --project backend ruff check .
      - name: ruff format --check (Python files and Python snippets in Markdown)
        run: uv run --project backend ruff format --check .
      - name: mypy --strict
        run: |
          (cd backend && uv run mypy)
          uv run --project backend mypy --strict --python-version 3.12 scripts/smoke.py
      - name: pytest (unit + API, one worker per vCPU)
        working-directory: backend
        run: uv run pytest -q -n 4 --dist worksteal

  frontend:
    name: frontend (lint, typecheck, test, build, OpenAPI drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - name: Install pnpm
        run: npm install --global --no-fund --no-audit "pnpm@${PNPM_VERSION}"
      - name: Locate the pnpm store
        id: pnpm
        working-directory: frontend
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml', 'frontend/patches/**') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: pnpm install (applies the react-aria CSP patch)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: lint (oxlint type-aware + prettier)
        working-directory: frontend
        run: pnpm lint
      - name: typecheck (tsc -b)
        working-directory: frontend
        run: pnpm typecheck
      - name: test (Vitest)
        working-directory: frontend
        run: pnpm test
      - name: build (vite build, precompress, content-blocker name check)
        working-directory: frontend
        run: pnpm build
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: OpenAPI drift (schema and generated client types are committed)
        run: |
          (cd backend && uv run virtubooth export-openapi -o ../frontend/openapi.json)
          (cd frontend && pnpm gen:api)
          git diff --exit-code frontend/openapi.json frontend/src/api/schema.gen.ts

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - name: Install pnpm
        run: npm install --global --no-fund --no-audit "pnpm@${PNPM_VERSION}"
      - name: Locate the pnpm store
        id: pnpm
        working-directory: frontend
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml', 'frontend/patches/**') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Build frontend/dist (the e2e server serves it)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python, the backend's dependencies and ${{ matrix.browser }}
        working-directory: backend
        run: |
          uv sync
          uv run playwright install --with-deps ${{ matrix.browser }}
          uv tool install py-spy  # DEBUG
      # 4 workers for the runner's 4 vCPUs and 16 GB (up to 1 GB each, see the Makefile).
      # Firefox runs under Xvfb: headless Firefox without any X display gets no WebGL
      # on a runner without a GPU (FEATURE_FAILURE_WEBGL_EXHAUSTED_DRIVERS), and the
      # camera then falls back to Canvas2D; with Xvfb's display it renders with Mesa's
      # llvmpipe. Chromium brings its own software WebGL (SwiftShader).
      - name: e2e (pytest + Playwright, fake cameras, zero console errors)
        working-directory: backend
        env:
          VB_E2E_BROWSER: ${{ matrix.browser }}
        run: |
          # DEBUG: dump the stacks of every pytest process if the run hangs
          (sleep 480; echo "=== WATCHDOG: still running after 8 min"; ps -ef --forest | grep -E "pytest|firefox|chrom|xvfb" | grep -v grep | cut -c1-200;
           for pid in $(pgrep -f "pytest|xdist|execnet|python"); do echo "=== py-spy $pid"; sudo "$HOME/.local/bin/py-spy" dump --pid "$pid" 2>&1 | head -120; done) &
          ${{ matrix.browser == 'firefox' && 'xvfb-run -a ' || '' }}uv run pytest -m e2e -v -n 4 --dist worksteal -o faulthandler_timeout=150

  docker:
    name: docker (build + smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build the image
        run: docker build -t virtubooth:ci .
      - name: Smoke test (gate, assets, guest upload, admin, export jobs, clean stop)
        env:
          VB_SMOKE_BUILD: "0"
          VB_SMOKE_IMAGE: virtubooth:ci
        run: scripts/docker-smoke.sh
