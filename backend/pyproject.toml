[project]
name = "virtubooth"
version = "0.2.0"
description = "Digital party photo booth: Beer Cam timelapse, filter booth, admin moderation"
readme = "README.md"
# 3.14 in Docker and locally (.python-version); 3.12 still works (the
# Playwright image that runs the WebKit tests has it)
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
    "pillow==12.3.0",
    "segno==1.6.6",
    "tzdata==2026.5",
]

[project.scripts]
virtubooth = "virtubooth.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "httpx2==2.13.1",
    "playwright==1.63.0",
    # axe-core 4.12.1 for the e2e accessibility scans (tests/e2e/axe.py), injected
    # with page.evaluate (the CSP refuses inline script tags)
    "axe-playwright-python==0.1.8",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtubooth"]

# ------------------------------------------------------------------ pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
# e2e_legacy holds the old DOM tests as a reference for wave 2: never collected
norecursedirs = [".venv", "data", "e2e_legacy", "fixtures"]
markers = [
    "e2e: browser end-to-end tests (playwright, against the built frontend/dist)",
    "visual: opt-in screenshot comparisons",
]
addopts = "-m 'not e2e and not visual'"

# -------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/e2e_legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "PIE", "LOG", "T10"]
ignore = [
    "E501",    # the formatter wraps code; long German strings stay readable
    "RUF001",  # German text: ×, –, „ are intended
    "RUF002",
    "RUF003",
    "SIM105",  # contextlib.suppress is not clearer than try/except/pass
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# tests: chained comparisons (`a == 1 == b`) and dict(**kw) are on purpose
"tests/**" = ["B011", "SIM117", "SIM300", "RUF012", "B018", "C408"]
# a hand-written CSS selector matcher: one branch per selector kind reads best
"tests/unit/blockerlists.py" = ["SIM114"]

[tool.ruff.lint.isort]
known-first-party = ["virtubooth"]

# -------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"
packages = ["virtubooth"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# segno ships no type information
module = ["segno", "segno.*"]
ignore_missing_imports = true
