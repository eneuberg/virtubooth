[project]
name = "virtubooth"
version = "0.1.0"
description = "Digital party photo booth: Beer Cam timelapse, filter booth, admin moderation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=11",
    "segno>=1.6",
    "tzdata>=2024.1",
]

[project.scripts]
virtubooth = "virtubooth.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13",
    "playwright==1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtubooth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "e2e_legacy"]
markers = ["e2e: browser end-to-end tests (playwright + chromium fake camera)"]
addopts = "-m 'not e2e'"
